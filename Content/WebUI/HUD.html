<!DOCTYPE html>
<html>
<head>
<style>
	body {
		margin: 0;
		padding: 0;
		overflow: hidden;
		font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		color: white;
		background: transparent;
	}
	.dashboard {
		position: absolute;
		bottom: 50px;
		right: 50px;
		width: 400px;
		padding: 30px;
		background: rgba(20, 20, 30, 0.4);
		backdrop-filter: blur(15px);
		-webkit-backdrop-filter: blur(15px);
		border-radius: 20px;
		border: 1px solid rgba(255, 255, 255, 0.1);
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
	}
	.metric {
		display: flex;
		justify-content: space-between;
		margin-bottom: 15px;
		font-size: 24px;
		border-bottom: 1px solid rgba(255,255,255,0.1);
		padding-bottom: 5px;
	}
	.value {
		font-weight: bold;
		color: #00ffcc;
		text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
	}
	h2 {
		margin-top: 0;
		color: #aaa;
		text-transform: uppercase;
		font-size: 14px;
		letter-spacing: 2px;
	}
</style>
</head>
<body>
	<div class="dashboard">
		<h2>Locomotive Telemetry</h2>
		<div class="metric"><span>Speed</span> <span class="value" id="speed">0 km/h</span></div>
		<div class="metric"><span>Brake Pipe</span> <span class="value" id="pipe">90 PSI</span></div>
		<div class="metric">
			<h2>Cylinder</h2>
			<div class="value"><span id="cyl">0</span> PSI</div>
		</div>
		<div class="metric wallet">
			<h2>Wallet</h2>
			<div class="value">$<span id="wallet">0</span></div>
		</div>
		<div class="metric" style="border:none;"><span>Throttle</span> <span class="value" id="throttle">0</span></div>
	</div>

	<div class="telemetry-panel" style="bottom: 140px;">
		<h2>Active Contract</h2>
		<div class="metric" style="border:none;">
			<span id="contract_text" style="color:#00ff00; font-size:16px;">Waiting for contract...</span>
		</div>
	</div>
	
	<!-- Phase 14: Dashboard Refit -->
	<div class="dashboard" style="right: 500px;">
		<h2>System Status</h2>
		<div class="metric"><span>Headlights</span> <span class="value" id="headlight_status">[OFF]</span></div>
		<div class="metric"><span>Next Signal</span> <span class="value" id="next_signal" style="color:red;">[RED]</span></div>
		<div class="metric" style="border:none;"><span>Track Event</span> <span class="value" id="track_event">Clear</span></div>
	</div>

	<script>
		function UpdateTelemetry(speed, pipe, cyl, throttle, wallet, contract, integrity, track_event, bHeadlight, next_signal) {
			document.getElementById('speed').innerText = speed;
			document.getElementById('pipe').innerText = pipe;
			document.getElementById('cyl').innerText = cyl;
			
			let throtElem = document.getElementById('throttle');
			throtElem.style.width = throttle + "%";

			document.getElementById('wallet').innerText = wallet.toLocaleString();
			
			if (contract) {
				document.getElementById('contract_text').innerText = contract;
			}
			
			if (bHeadlight) {
				document.getElementById('headlight_status').innerText = "[ON]";
				document.getElementById('headlight_status').style.color = "#00ff00";
			} else {
				document.getElementById('headlight_status').innerText = "[OFF]";
				document.getElementById('headlight_status').style.color = "#aaaaaa";
			}
			
			document.getElementById('next_signal').innerText = "[" + next_signal + "]";
			if (next_signal === "GREEN") document.getElementById('next_signal').style.color = "#00ff00";
			else if (next_signal === "YELLOW") document.getElementById('next_signal').style.color = "#ffff00";
			else document.getElementById('next_signal').style.color = "#ff0000";
			
			document.getElementById('track_event').innerText = track_event;
		}
	</script>
</body>
</html>
